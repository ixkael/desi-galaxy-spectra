[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desi-galaxy-spectra"
version = "1.0.0"
description = "Extraction of DESI DR1 galaxy spectra into HDF5 archives"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "astropy==6.1.7",
    "astropy-iers-data==0.2026.10.19.0.52.1",
    "certifi==2026.10.19",
    "charset-normalizer==3.5.2",
    "configobj==5.0.9",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "desimodel==0.20.0",
    "desispec==0.70.0",
    "desitarget==4.4.0",
    "desiutil==4.0.1",
    "fitsio==1.4.2",
    "fonttools==4.65.0",
    "greenlet==3.5.6",
    "h5py==3.16.0",
    "healpy==1.20.1",
    "idna==3.20",
    "kiwisolver==1.5.1",
    "llvmlite==0.50.0",
    "matplotlib==3.10.9",
    "numba==0.68.0",
    "numpy==2.2.6",
    "packaging==26.3",
    "pillow==12.3.0",
    "pyerfa==2.0.1.5",
    "pyparsing==3.3.3",
    "python-dateutil==3.0.0",
    "pytz==2026.5",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.15.3",
    "six==1.17.0",
    "speclite==1.0.0",
    "sqlalchemy==2.0.55",
    "typing-extensions==4.16.0",
    "tzdata==2026.5",
    "urllib3==2.8.0",
    'tomli==2.2.1; python_version < "3.11"',
]

[project.scripts]
dgs = "desi_galaxy_spectra.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["desi_galaxy_spectra"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
extend-exclude = ["desi_galaxy_spectra/frozen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
